<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cygnus Payment Example</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>Cygnus Payment Demo</h1>
        <p class="subtitle">Experience seamless payment integration</p>
      </div>

      <div class="product">
        <div class="product-image">
          <svg
            width="64"
            height="64"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              d="M20 7L12 3L4 7M20 7L12 11M20 7V17L12 21M12 11L4 7M12 11V21M4 7V17L12 21"
            />
          </svg>
        </div>
        <div class="product-details">
          <h3>Premium Subscription</h3>
          <p>
            Get unlimited access to all premium features and priority support
          </p>
          <div class="price">
            $49.99 <span class="price-period">/ month</span>
          </div>
          <div class="features">
            <div class="feature">Unlimited Access</div>
            <div class="feature">Priority Support</div>
            <div class="feature">Advanced Analytics</div>
          </div>
        </div>
      </div>

      <button id="payment-button">Pay Now</button>
    </div>

    <div id="toast" class="toast"></div>

    <!-- Load the Cygnus SDK from GitHub -->
    <script src="https://cdn.jsdelivr.net/gh/Flexxa-Dev/cygnus_web_sdk@dev/dist/cygnus.js"></script>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        // Toast notification function
        function showToast(message, type) {
          const toast = document.getElementById("toast");
          toast.textContent = message;
          toast.className = `toast ${type}`;

          // Force reflow
          toast.offsetHeight;

          toast.classList.add("show");

          setTimeout(() => {
            toast.classList.remove("show");
          }, 3000);
        }

        // Initialize Cygnus SDK
        const cygnus = new window.Cygnus({
          apiKey:
            "sk_3_87e7ba8f18c290e4b0cc89cefd15b7e8c096c138d8599065a51ae43f954e267c",
          companyName: "Demo Store",
          theme: {
            primaryColor: "#0070f4",
            backgroundColor: "#f9f9f9",
            fontColor: "#333333",
            buttonText: "Complete Payment",
            buttonTextColor: "#ffffff",
          },
        });

        // Add event listeners for payment events
        cygnus.on("paymentSuccess", function (data) {
          console.log("Payment successful!", data);
          showToast("Payment completed successfully!", "success");
        });

        cygnus.on("paymentFailed", function (data) {
          console.log("Payment failed:", data);
          showToast(`Payment failed: ${data.error}`, "error");
        });

        // Set up payment button
        const paymentButton = document.getElementById("payment-button");
        paymentButton.addEventListener("click", function () {
          // Start payment process
          cygnus.startPayment({
            amount: 4999, // Amount in cents
            currency: "usd",
            metadata: {
              orderId: "ORDER_" + Math.floor(Math.random() * 1000000),
              productName: "Premium Subscription",
              customerEmail: "customer@example.com",
            },
          });
        });
      });
    </script>
  </body>
</html>
